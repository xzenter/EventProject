services:
  # ─────────────────────────── Инфраструктура обмена сообщениями ──────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  # ─────────────────────────── Базы данных (по одной на сервис) ───────────────────────────
  users-db:
    image: postgres:16
    container_name: users-db
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  events-db:
    image: postgres:16
    container_name: events-db
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookings-db:
    image: postgres:16
    container_name: bookings-db
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10 
  # ─────────────────────────── Сервисы ────────────────────────────────────────────────────
  users-api:
    build:
      context: .
      dockerfile: EventProject.Users.Presentation/Dockerfile
    container_name: users-api
    restart: unless-stopped
    depends_on:
      users-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      # Порт внешнего запроса API:5001 -> контейнер:8080
      - "5001:8080"
    environment:
      # Используется appsettings.Docker.json
      ASPNETCORE_ENVIRONMENT: Docker
      # ASP.NET Core слушает 8080 внутри контейнера
      ASPNETCORE_URLS: http://+:8080
  
  events-api:
    build:
      context: .
      dockerfile: EventProject.Events.Presentation/Dockerfile
    container_name: events-api
    restart: unless-stopped
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      # Порт внешнего запроса API:5002 -> контейнер:8080
      - "5002:8080"
    environment:
      # Используется appsettings.Docker.json
      ASPNETCORE_ENVIRONMENT: Docker
      # ASP.NET Core слушает 8080 внутри контейнера
      ASPNETCORE_URLS: http://+:8080
      
  
  bookings-api:
    build:
      context: .
      dockerfile: EventProject.Bookings.Presentation/Dockerfile
    container_name: bookings-api
    restart: unless-stopped
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      # Порт внешнего запроса API:5003 -> контейнер:8080
      - "5003:8080"
    environment:
      # Используется appsettings.Docker.json
      ASPNETCORE_ENVIRONMENT: Docker
      # ASP.NET Core слушает 8080 внутри контейнера
      ASPNETCORE_URLS: http://+:8080
  
volumes:
  users-db-data:
  events-db-data:
  bookings-db-data:
